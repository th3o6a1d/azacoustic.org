<form name="contact" method="POST" netlify netlify-honeypot="bot-field" class="contact-form">
  <input type="hidden" name="form-name" value="contact" />
  <p style="display: none;">
    <label>Don't fill this out if you're human: <input name="bot-field" /></label>
  </p>
  
  <div class="form-group">
    <label for="name">Name *</label>
    <input type="text" id="name" name="name" required />
  </div>
  
  <div class="form-group">
    <label for="email">Email *</label>
    <input type="email" id="email" name="email" required />
  </div>
  
  <div class="form-group">
    <label for="address">Address *</label>
    <textarea id="address" name="address" rows="3" required placeholder="Street address, city, state, zip code"></textarea>
  </div>
  
  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="Tell us about yourself or what you're interested in..."></textarea>
  </div>
  
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
